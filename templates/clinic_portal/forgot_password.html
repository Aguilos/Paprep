{% extends 'clinic_portal/auth_base.html' %}
{% block title %}Reset Clinic Password{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center px-3" style="background:linear-gradient(135deg,#1a3a5c 0%,#0d6efd 100%);">
  <div class="card shadow-lg border-0 p-4 p-md-5" style="width:100%;max-width:460px;border-radius:18px;">
    <h2 class="fw-bold mb-2">Reset clinic password</h2>
    <p class="text-muted small">Enter your clinic account email.</p>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="email" name="email" class="form-control form-control-lg mb-3" required autocomplete="email">
      <button type="submit" class="btn btn-primary w-100 btn-lg">Request Reset Link</button>
    </form>
    {% if reset_url %}
    <div class="alert alert-warning mt-4 small">Development delivery: <a href="{{ reset_url }}" class="d-block text-break mt-2">{{ reset_url }}</a></div>
    {% endif %}
    <a href="{{ url_for('clinic_portal.login') }}" class="text-center mt-3 small">Back to clinic login</a>
  </div>
</div>
{% endblock %}

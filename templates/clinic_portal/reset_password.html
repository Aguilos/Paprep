{% extends 'clinic_portal/auth_base.html' %}
{% block title %}Choose New Password{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center px-3" style="background:linear-gradient(135deg,#1a3a5c 0%,#0d6efd 100%);">
  <div class="card shadow-lg border-0 p-4 p-md-5" style="width:100%;max-width:460px;border-radius:18px;">
    <h2 class="fw-bold mb-4">Choose a new password</h2>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label">New Password</label>
      <input type="password" name="password" class="form-control form-control-lg mb-3" minlength="8" required autocomplete="new-password">
      <label class="form-label">Confirm Password</label>
      <input type="password" name="confirm_password" class="form-control form-control-lg mb-4" minlength="8" required autocomplete="new-password">
      <button type="submit" class="btn btn-primary w-100 btn-lg">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}

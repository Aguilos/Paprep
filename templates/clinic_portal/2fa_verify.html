<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Factor Authentication | PaPrep Clinic Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; background: #f0f4f8; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; }
    .card { border-radius: 20px; border: none; box-shadow: 0 8px 32px rgba(0,0,0,.10); max-width: 420px; width: 100%; }
    .shield-icon { width: 64px; height: 64px; background: linear-gradient(135deg,#1a3a5c,#0d6efd);
                   border-radius: 18px; display: flex; align-items: center; justify-content: center;
                   font-size: 30px; color: #fff; margin: 0 auto 16px; }
    .code-input { font-size: 2rem; letter-spacing: .5rem; text-align: center; font-weight: 700; }
  </style>
</head>
<body>
<div class="card p-4 p-md-5 mx-3">
  <div class="text-center mb-4">
    <div class="shield-icon"><i class="bi bi-shield-lock-fill"></i></div>
    <h4 class="fw-800 mb-1">Two-Factor Authentication</h4>
    <p class="text-muted small mb-0">Enter the 6-digit code from your authenticator app.</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show py-2">
      {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('clinic_portal.verify_2fa') }}" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-4">
      <input type="text" name="code" class="form-control code-input"
             inputmode="numeric" pattern="[0-9 ]*" maxlength="7"
             placeholder="000000" autofocus required>
    </div>
    <button type="submit" class="btn btn-primary w-100 py-2 fw-700">
      <i class="bi bi-check-circle me-2"></i> Verify
    </button>
  </form>

  <div class="text-center mt-3">
    <a href="{{ url_for('clinic_portal.login') }}" class="text-muted small">
      <i class="bi bi-arrow-left me-1"></i> Back to Login
    </a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

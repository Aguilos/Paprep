{% extends 'base.html' %}
{% block title %}Choose New Password{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-card-header">
      <div class="auth-logo"><i class="bi bi-shield-lock-fill"></i></div>
      <h2 class="auth-title">Choose a new password</h2>
    </div>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password" class="form-label">New Password</label>
      <input type="password" class="form-control form-control-lg mb-3" id="password" name="password" minlength="8" required autocomplete="new-password">
      <label for="confirm_password" class="form-label">Confirm Password</label>
      <input type="password" class="form-control form-control-lg mb-4" id="confirm_password" name="confirm_password" minlength="8" required autocomplete="new-password">
      <button type="submit" class="btn btn-primary w-100 btn-lg">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
